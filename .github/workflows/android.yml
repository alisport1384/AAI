name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Never run two builds of the same ref at once (duplicate downloads cause Maven 429s).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Optional personal backend tests (stdlib + SQLite FTS5)
        run: python3 -m unittest selfhost.test_hushyar_backend -v

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Prepare two ABI-specific APKs
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$version"
          echo "AAI_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p apk-out

      - name: Build 32-bit APK (armeabi-v7a)
        run: |
          gradle --no-daemon --stacktrace -PciAbi=armeabi-v7a :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
            "apk-out/Hushyar-${AAI_VERSION}-armeabi-v7a-debug.apk"

      - name: Build 64-bit APK (arm64-v8a)
        run: |
          gradle --no-daemon --stacktrace -PciAbi=arm64-v8a :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
            "apk-out/Hushyar-${AAI_VERSION}-arm64-v8a-debug.apk"

      - name: Verify both APKs contain only their target ABI and native model
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for abi in armeabi-v7a arm64-v8a; do
            apk="apk-out/Hushyar-${AAI_VERSION}-${abi}-debug.apk"
            unzip -Z1 "$apk" > apk-files.txt
            grep -qx "lib/$abi/libhushyar_llama.so" apk-files.txt
            if grep '^lib/' apk-files.txt | grep -v "^lib/$abi/"; then
              echo "::error::$apk includes libraries for another ABI"; exit 1
            fi
            badging=$("$bt/aapt2" dump badging "$apk")
            echo "$badging" | grep -q "versionName='${AAI_VERSION}'"
            echo "$badging" | grep -q "native-code: '${abi}'"
            "$bt/apksigner" verify "$apk" >/dev/null 2>&1
            echo "$apk: $abi only, model library present, signature verified"
          done
          (cd apk-out && sha256sum *.apk > SHA256SUMS.txt)
          cat apk-out/SHA256SUMS.txt

      - name: Upload both APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: hushyar-debug-apk
          path: |
            apk-out/*.apk
            apk-out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
